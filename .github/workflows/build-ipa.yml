name: Build unsigned IPA

# Free macOS runner build. Produces SolitaireAI.ipa as a workflow artifact,
# which you then sign and install on Windows with Sideloadly.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Install XcodeGen
        run: brew install xcodegen || sudo gem install xcodeproj

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project SolitaireAI.xcodeproj \
            -target SolitaireAI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SolitaireAI.app Payload/
          zip -qry SolitaireAI.ipa Payload
          unzip -l SolitaireAI.ipa | grep -i plugins || (echo "extension missing" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: SolitaireAI-ipa
          path: SolitaireAI.ipa
